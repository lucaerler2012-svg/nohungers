plugins {
    // Ab Minecraft 26.1 ist das Spiel nicht mehr obfuskiert -> Loom OHNE Remapping.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom fügt Mojang- und Fabric-Maven automatisch hinzu.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Kein "mappings" und kein "modImplementation" mehr (Minecraft 26.x ist unobfuskiert).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    // Erzeugt zusätzlich eine -sources.jar (die Haupt-JAR ist die ohne "-sources").
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
